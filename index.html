<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>To Do List</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stars"></div>

    <div class="planner-card">
      <div class="planner-header">
        <h1>To Do List</h1>
        <div class="header-bar">
          <span id="hari"></span>
          <span id="tanggal"></span>
        </div>
      </div>

      <ul id="daftar-tugas" class="planner-list"></ul>

      <form id="form-tambah" class="planner-add">
        <input type="text" id="input-tugas" placeholder="+ tambah tugas..." required />
      </form>

      <div class="planner-notes">
        <label for="catatan">Catatan :</label>
        <textarea id="catatan" placeholder="Tulis catatan di sini..."></textarea>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
